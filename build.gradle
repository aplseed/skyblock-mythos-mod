plugins {
	// 26.1+ ships unobfuscated: the new Loom plugin, no mappings, no remapping.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// one jar per Minecraft version: mythos-0.2.0+mc26.3.jar
version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = 'mythos'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// plain unit tests for the accessory calculator (src/test); no game needed
	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft', project.minecraft_version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version, 'minecraft': project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Client game test (src/gametest): boots the real client against
// .github/fake-backend and checks every panel. Run: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'mythos-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
