name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # One jar per supported Minecraft version; `build` also runs the unit tests (src/test).
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            fabric_api: '0.161.0+26.2'
          - minecraft: '26.3'
            fabric_api: '0.166.2+26.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}
      - uses: actions/upload-artifact@v4
        with:
          name: mythos-jar-${{ matrix.minecraft }}
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report-${{ matrix.minecraft }}
          path: build/reports/tests
          if-no-files-found: ignore

  # Boots the real client headless against recorded server responses and
  # checks what every panel and window tab draws (src/gametest).
  client-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 26.3 opens its window through SDL, which may not get an OpenGL context under Xvfb:
    # its run is informative until that's known to work on the runner
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            fabric_api: '0.161.0+26.2'
            experimental: false
          - minecraft: '26.3'
            fabric_api: '0.166.2+26.3'
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libegl1
      - name: Start the fake backend
        run: |
          nohup python3 .github/fake-backend/server.py > fake-backend.log 2>&1 &
          sleep 1
          curl -s -X POST localhost:5658/api/auth/login -d '{}' | head -c 120; echo
      - name: Run the client game test
        env:
          XDG_RUNTIME_DIR: /tmp
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}
      - name: Test output
        if: always()
        run: |
          echo "=== fake backend"; cat fake-backend.log
          LOG=$(find build/run -name latest.log | head -1)
          echo "=== $LOG (mythos lines)"
          grep -n -A12 "\[gametest\]\|mythos\|Mythos\|Exception\|Error" "$LOG" | head -500 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-screenshots-${{ matrix.minecraft }}
          path: |
            build/run/**/screenshots/*.png
            build/run/**/logs/latest.log
          if-no-files-found: ignore
